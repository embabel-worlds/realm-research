# arXiv — public e-print API (Atom XML), no auth. Migrated off the arxiv MCP server.
# arXiv asks for polite use (~1 request / 3s, single connection, a descriptive
# User-Agent), same etiquette as Wikipedia below. The gateway hands the raw Atom
# XML to the LLM as text, so no JSON/structured parsing is needed for chat use.
- url: arxiv.yaml
  name: arxiv
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# OpenAlex — free, open scholarly catalogue (JSON), no auth. Backs the
# ResearchPaper virtual-cypher join (papers as queryable graph nodes). A polite
# User-Agent + a `mailto` (set on the producer) get the faster "polite pool".
- url: openalex.yaml
  name: openalex
  type: openapi
  # The key is OPTIONAL (me#3936 `token-optional`). Without one, OpenAlex answers from a free daily budget shared
  # by everyone on the appliance's IP ($0.10 a day, ~100 searches, 10 requests a second); with a free key
  # (https://openalex.org) the budget is your own, $1 a day (~1,000 searches) at 30 a second. Sent as
  # `Authorization: Bearer <key>`, which OpenAlex accepts in place of ?api_key=.
  auth: bearer
  token-env: OPENALEX_API_KEY
  token-optional: true
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# ROR — Research Organization Registry, public, no auth. Backs matchInstitutions, which resolves
# the institution names on a record to registry identities through ROR's affiliation matcher.
- url: ror.yaml
  name: ror
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# Brave Search — vendored OpenAPI spec, API-key auth.
# BRAVE_API_KEY is read from the workspace credential store first,
# then process env. Missing key => the API is skipped at load time.
# The default world declares the same API under the same `brave` name
# (config/apis/web-search.yml) so web search works without this realm.
# API names are one namespace across a world and its realms, and a later
# declaration that is the SAME API (same spec content, servers, auth,
# token-env, capability-tags and every other field that shapes a call) is
# that API, loaded once with no problem; the world's entry, learned first,
# holds the `brave` namespace and its credential. If this entry or
# brave.yaml drifts from the world's in any of those, it is a different
# API: it loads as `brave_research` and this realm reads degraded with a
# problem naming the fields that differ. Keep both identical.
# `capability-tags: [web-search]` declares what the API is FOR, so a
# consumer that must choose a search tool without an LLM in the loop
# (person research) selects on the capability rather than on the word
# "brave". Distinct from `tags`, which filters a spec's operations.
- url: brave.yaml
  name: brave
  type: openapi
  auth: api-key
  token-env: BRAVE_API_KEY
  capability-tags: [web-search]

# Wikipedia — public, no auth.
# Wikimedia rejects requests without a User-Agent (HTTP 403 — see
# https://w.wiki/4wJS). The gateway's default Spring User-Agent is
# considered "robot policy" violating, so we set our own.
# Tagged `web-search` alongside brave because selection is ALL-OR-NOTHING:
# once anything in the world declares the capability, only declared tools
# are chosen. Wikipedia was reached before this only because the host
# matched the name "wikipedia"; leaving it untagged while brave is tagged
# would silently drop it from research it used to serve. The tag sits on
# the entry, so it covers every operation this spec exposes — `getSummary`
# reads a page rather than searching, which is the same reach the name
# match gave it.
- url: wikipedia.yaml
  name: wikipedia
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"
  capability-tags: [web-search]

# Wikidata Query Service — public SPARQL, no auth, no key.
# Backs the CorporateEntity join: a company name resolves to its Wikidata entity and,
# through the parent-organization chain, to its ultimate owner. Same Wikimedia
# User-Agent rule as Wikipedia above — a request without one is refused with a 403.
- url: wikidata.yaml
  name: wikidata
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# YouTube Data API v3 (search) — vendored OpenAPI spec, API-key auth. NOT an MCP
# server. One operation, `searchYouTubeVideos` (→ gateway.youtube.searchYouTubeVideos),
# a free-text video search — general enough to belong here in the research pack rather
# than any one consumer. pack-impromptu depends on it for classical-work recordings.
# YOUTUBE_API_KEY is read from the workspace credential store first, then process env;
# a missing key => the API is skipped at load time.
- url: youtube.yaml
  name: youtube
  type: openapi
  auth: api-key
  token-env: YOUTUBE_API_KEY
  operation-ids:
    - searchYouTubeVideos

# Supadata — vendored OpenAPI spec, API-key auth (x-api-key header, like Brave's
# X-Subscription-Token). Two ops: `getVideoTranscript` (the transcript of a YouTube /
# TikTok / Instagram / X / Facebook video — the OFFICIAL YouTube Data API cannot do this:
# captions.download is OAuth + video-owner-only) and `getMediaMetadata` (unified metadata
# incl. video DURATION, which YouTube search.list doesn't return). Powers the
# HAS_TRANSCRIPT virtual join (types/video.yml, producers/video.yml).
# SUPADATA_API_KEY is read from the workspace credential store first, then process env;
# a missing key => the API is skipped at load time and transcript joins are hidden.
- url: supadata.yaml
  name: supadata
  type: openapi
  auth: api-key
  token-env: SUPADATA_API_KEY
  operation-ids:
    - getVideoTranscript
    - getMediaMetadata
    - getAccount        # free; the key check in keys.yml
