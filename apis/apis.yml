# arXiv — public e-print API (Atom XML), no auth. Migrated off the arxiv MCP server.
# arXiv asks for polite use (~1 request / 3s, single connection, a descriptive
# User-Agent), same etiquette as Wikipedia below. The gateway hands the raw Atom
# XML to the LLM as text, so no JSON/structured parsing is needed for chat use.
- url: arxiv.yaml
  name: arxiv
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# OpenAlex — free, open scholarly catalogue (JSON), no auth. Backs the
# ResearchPaper virtual-cypher join (papers as queryable graph nodes). A polite
# User-Agent + a `mailto` (set on the producer) get the faster "polite pool".
- url: openalex.yaml
  name: openalex
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# Brave Search — vendored OpenAPI spec, API-key auth.
# BRAVE_API_KEY is read from the workspace credential store first,
# then process env. Missing key => the API is skipped at load time.
- url: brave.yaml
  name: brave
  type: openapi
  auth: api-key
  token-env: BRAVE_API_KEY

# Wikipedia — public, no auth.
# Wikimedia rejects requests without a User-Agent (HTTP 403 — see
# https://w.wiki/4wJS). The gateway's default Spring User-Agent is
# considered "robot policy" violating, so we set our own.
- url: wikipedia.yaml
  name: wikipedia
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"
