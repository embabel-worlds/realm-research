# arXiv — public e-print API (Atom XML), no auth. Migrated off the arxiv MCP server.
# arXiv asks for polite use (~1 request / 3s, single connection, a descriptive
# User-Agent), same etiquette as Wikipedia below. The gateway hands the raw Atom
# XML to the LLM as text, so no JSON/structured parsing is needed for chat use.
- url: arxiv.yaml
  name: arxiv
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# OpenAlex — free, open scholarly catalogue (JSON), no auth. Backs the
# ResearchPaper virtual-cypher join (papers as queryable graph nodes). A polite
# User-Agent + a `mailto` (set on the producer) get the faster "polite pool".
- url: openalex.yaml
  name: openalex
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# Brave Search — vendored OpenAPI spec, API-key auth.
# BRAVE_API_KEY is read from the workspace credential store first,
# then process env. Missing key => the API is skipped at load time.
# The default workspace vendors the same spec under the same `brave`
# name (config/apis/web-search.yml) so web search works without this
# pack; the loader dedupes by URL so both entries load, and the
# workspace-tier entry wins the shared namespace. Keep the two copies
# of brave.yaml identical.
- url: brave.yaml
  name: brave
  type: openapi
  auth: api-key
  token-env: BRAVE_API_KEY

# Wikipedia — public, no auth.
# Wikimedia rejects requests without a User-Agent (HTTP 403 — see
# https://w.wiki/4wJS). The gateway's default Spring User-Agent is
# considered "robot policy" violating, so we set our own.
- url: wikipedia.yaml
  name: wikipedia
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# Wikidata Query Service — public SPARQL, no auth, no key.
# Backs the CorporateEntity join: a company name resolves to its Wikidata entity and,
# through the parent-organization chain, to its ultimate owner. Same Wikimedia
# User-Agent rule as Wikipedia above — a request without one is refused with a 403.
- url: wikidata.yaml
  name: wikidata
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"

# YouTube Data API v3 (search) — vendored OpenAPI spec, API-key auth. NOT an MCP
# server. One operation, `searchYouTubeVideos` (→ gateway.youtube.searchYouTubeVideos),
# a free-text video search — general enough to belong here in the research pack rather
# than any one consumer. pack-impromptu depends on it for classical-work recordings.
# YOUTUBE_API_KEY is read from the workspace credential store first, then process env;
# a missing key => the API is skipped at load time.
- url: youtube.yaml
  name: youtube
  type: openapi
  auth: api-key
  token-env: YOUTUBE_API_KEY
  operation-ids:
    - searchYouTubeVideos

# Supadata — vendored OpenAPI spec, API-key auth (x-api-key header, like Brave's
# X-Subscription-Token). Two ops: `getVideoTranscript` (the transcript of a YouTube /
# TikTok / Instagram / X / Facebook video — the OFFICIAL YouTube Data API cannot do this:
# captions.download is OAuth + video-owner-only) and `getMediaMetadata` (unified metadata
# incl. video DURATION, which YouTube search.list doesn't return). Powers the
# HAS_TRANSCRIPT virtual join (types/video.yml, producers/video.yml).
# SUPADATA_API_KEY is read from the workspace credential store first, then process env;
# a missing key => the API is skipped at load time and transcript joins are hidden.
- url: supadata.yaml
  name: supadata
  type: openapi
  auth: api-key
  token-env: SUPADATA_API_KEY
  operation-ids:
    - getVideoTranscript
    - getMediaMetadata
