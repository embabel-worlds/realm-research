# Brave Search — vendored OpenAPI spec, API-key auth.
# BRAVE_API_KEY is read from the workspace credential store first,
# then process env. Missing key => the API is skipped at load time.
- url: brave.yaml
  name: brave
  type: openapi
  auth: api-key
  token-env: BRAVE_API_KEY

# Wikipedia — public, no auth.
# Wikimedia rejects requests without a User-Agent (HTTP 403 — see
# https://w.wiki/4wJS). The gateway's default Spring User-Agent is
# considered "robot policy" violating, so we set our own.
- url: wikipedia.yaml
  name: wikipedia
  type: openapi
  auth: none
  headers:
    User-Agent: "EmbabelAssistant/1.0 (https://github.com/johnsonr/pack-research; assistant@embabel.com)"
