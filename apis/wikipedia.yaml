openapi: 3.0.3
info:
  title: Wikipedia
  description: >
    Read-only access to English Wikipedia via the public MediaWiki Core REST API
    and Wikimedia REST page-summary endpoint. No authentication required.
  version: "1.0"

servers:
  - url: https://en.wikipedia.org

components:
  schemas:
    SearchPage:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          description: URL-safe page key — pass to getSummary as the title.
        title:
          type: string
          description: Display title of the page.
        excerpt:
          type: string
          description: HTML excerpt with <span class='searchmatch'>...</span> highlights around matched terms.
        description:
          type: string
          description: Short Wikidata-derived description of the page.
    SearchResponse:
      type: object
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/SearchPage'
    PageSummary:
      type: object
      properties:
        title:
          type: string
        displaytitle:
          type: string
        description:
          type: string
        extract:
          type: string
          description: Plain-text summary of the page (typically the lead section).
        content_urls:
          type: object
          properties:
            desktop:
              type: object
              properties:
                page:
                  type: string
                  format: uri

paths:
  /w/rest.php/v1/search/page:
    get:
      operationId: search
      summary: "Search Wikipedia. Call: search({ q: '...', limit: 10 }). The query field is named `q`, not `query`."
      description: >
        Search Wikipedia for the query. Returns matching pages with title, short
        description, and an HTML-highlighted excerpt. Follow up with getSummary(title)
        to read the lead-section content of any result. The query string MUST be
        passed as `q` (single letter).
      parameters:
        - name: q
          in: query
          required: true
          description: "Search query string (parameter name is literally `q`, not `query`)."
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /w/api.php:
    get:
      operationId: searchSummaries
      summary: "Search Wikipedia and return each candidate's plain-text summary + Wikidata id in ONE call."
      description: >
        MediaWiki Action API search that, unlike `search`, returns for each candidate the plain-text lead
        `extract`, the canonical `fullurl`, and the Wikidata id (`pageprops.wikibase_item`) — everything
        needed to disambiguate a person to the right article. Backs the WikipediaArticle virtual-cypher join.
        MUST be called with `formatversion=2` so `query.pages` is an ARRAY (not an object map).
      parameters:
        - { name: action, in: query, required: true, schema: { type: string, default: query } }
        - { name: generator, in: query, required: true, schema: { type: string, default: search } }
        - name: gsrsearch
          in: query
          required: true
          description: The search query (the person's name).
          schema: { type: string }
        - { name: gsrlimit, in: query, schema: { type: integer, default: 3 } }
        - { name: prop, in: query, schema: { type: string, default: "extracts|info|pageprops" } }
        - { name: exintro, in: query, schema: { type: integer, default: 1 } }
        - { name: explaintext, in: query, schema: { type: integer, default: 1 } }
        - { name: inprop, in: query, schema: { type: string, default: url } }
        - { name: ppprop, in: query, schema: { type: string, default: wikibase_item } }
        - { name: format, in: query, schema: { type: string, default: json } }
        - { name: formatversion, in: query, schema: { type: integer, default: 2 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: object
                    properties:
                      pages:
                        type: array
                        items:
                          type: object
                          properties:
                            pageid: { type: integer }
                            title: { type: string }
                            extract: { type: string, description: Plain-text lead-section summary. }
                            fullurl: { type: string, format: uri }
                            pageprops:
                              type: object
                              properties:
                                wikibase_item: { type: string, description: "Wikidata Q-id (stable cross-language handle)." }

  /api/rest_v1/page/summary/{title}:
    get:
      operationId: getSummary
      summary: Get the lead-section summary of a Wikipedia page
      description: >
        Returns a clean plain-text summary of the page (typically the lead section)
        plus its display title, short description, and canonical URL. Pass the
        exact title returned by search.
      parameters:
        - name: title
          in: path
          required: true
          description: Wikipedia page title (URL encoding handled by the gateway).
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSummary'
