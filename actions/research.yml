stepType: action
name: research
description: "Research a topic using web search and available sources. Gather comprehensive findings with source links."
inputTypeNames:
  - ResearchRequest
outputTypeName: ResearchResult
canRerun: false
prompt: |
  Research the following topic: {{researchRequest.topic}}

  Use the search tools to find relevant, recent information from the web,
  arXiv, and Wikipedia. Compile your findings into a clear, well-structured
  markdown summary with all source URLs you referenced.

  Use the progress tool to note important sources and findings as you go.

  Do NOT create or update any document. The user will ask explicitly if they
  want the findings saved as a living document; otherwise just return the
  findings.

tools:
  - brave
  - fetch
  - arxiv
  - progress
  - wikipedia
