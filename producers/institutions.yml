# Canonicalize an institution NAME to its registry identity.
#
# The problem this solves: "Mass General", "Massachusetts General Hospital" and "MGH" are one institution
# written three ways, and counting the strings counts them as three. ROR's affiliation matcher is built
# for exactly this input — human-typed institution text — and returns a match SCORE, so a weak match can
# be shown as weak instead of being presented with the same confidence as an exact one.

# A realm handler rather than a direct call, for two things a flat projection cannot express:
#   - the registry's DISPLAY name. Names arrive unordered and include acronyms and local-language
#     forms, so reading the first one yields "MGH" as often as the real name.
#   - the PARENT. Parents, children and related organizations share one array, and selecting the parent
#     needs a filter. Projecting types and labels as parallel lists is lossless but pushes that
#     filtering onto every consumer, in Cypher, forever.
# The handler also keeps going when one name fails, so a single bad affiliation string cannot read as
# "none of these institutions are known".
- name: institutionsByName
  kind: remote
  operation: matchInstitutions
  keyArg: names
  records: "$[*]"
  cache:
    kind: ttl
    seconds: 604800   # a week — institutional identity is stable
  cost:
    bucket: ror
    rate: "5/sec"
    yield: high
